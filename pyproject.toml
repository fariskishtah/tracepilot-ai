[project]
name = "tracepilot-ai"
version = "1.0.0"
description = "TracePilot AI - Agentic RAG & Intelligent Knowledge Orchestration Platform"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faris Mohamed Kishtah" }]
dependencies = [
  "gradio>=5,<6", "chromadb>=1.0", "sentence-transformers>=3.0", "pymupdf>=1.24", "python-docx>=1.1",
  "pandas>=2.2", "numpy>=1.26", "pydantic>=2.6", "pyyaml>=6", "requests>=2.31", "rank-bm25>=0.2.2", "psutil>=5.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45", "matplotlib>=3.8", "reportlab>=4.0"]
[tool.setuptools.packages.find]
include = ["src*"]
